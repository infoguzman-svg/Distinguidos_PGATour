<meta name="theme-color" content="#000000">
<style>
:root{--lime:#c6f613;--g1:#0a2a1c;--g2:#14523a;--gold:#c9a227;--bg:#f3f1e8;--card:#fff;--ink:#14201a;--mut:#667268;--line:#e3dfcf;--soft:#f7f5ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
.hero{background:radial-gradient(720px 260px at 88% -35%,rgba(198,246,19,.22),transparent 70%),linear-gradient(180deg,#000,#0c1007);color:#fff;padding:20px 16px 0}
.wrap{max-width:980px;margin:0 auto}
.brand{display:flex;align-items:center;gap:22px;margin-bottom:16px}
.logo{height:150px;width:auto;flex:none}
.hero h1{margin:0;font-size:1.7rem;letter-spacing:.2px}
.hero h1 b{color:var(--lime)}
.sub{opacity:.8;font-size:.85rem;margin:4px 0 0}
nav{display:flex;gap:6px}
nav button{flex:1;max-width:220px;border:0;background:rgba(255,255,255,.1);color:#fff;font:inherit;font-weight:600;font-size:.92rem;padding:11px 10px;border-radius:12px 12px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--g1)}
main{max-width:980px;margin:0 auto;padding:18px 14px 50px}
.sec{display:none}.sec.on{display:block}
h2{font-size:1.05rem;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
h2:first-child{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 1px 2px rgba(20,32,26,.04)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums}
.tot{font-weight:800;font-size:1.05rem}
.lead td{background:#fbf5dc}
.av{display:inline-flex;width:32px;height:32px;border-radius:50%;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:1.05rem;line-height:1;margin-right:9px;vertical-align:middle;flex:none}
.who{display:flex;align-items:center}
.cb{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:99px;color:#fff;background:var(--c)}
.stage{position:relative;overflow:hidden;border-radius:20px;padding:22px 12px 0;color:#fff;background:radial-gradient(500px 220px at 50% 0,rgba(255,224,130,.28),transparent 70%),linear-gradient(170deg,#0a2a1c,#14523a)}
.stage:before{content:"✨";position:absolute;left:8%;top:14px;font-size:1.1rem;opacity:.8}.stage:after{content:"✨";position:absolute;right:9%;top:34px;font-size:.9rem;opacity:.7}
.podio{display:grid;grid-template-columns:1fr 1.18fr 1fr;gap:8px;align-items:end;max-width:640px;margin:0 auto}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center;animation:sube .7s ease both}
.pl.p1{animation-delay:.15s}.pl.p2{animation-delay:.3s}.pl.p3{animation-delay:.45s}
@keyframes sube{from{transform:translateY(34px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.pl{animation:none}}
.pl .crown{font-size:1.9rem;line-height:1;margin-bottom:2px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
.pl .av{width:60px;height:60px;font-size:2rem;margin:0 0 6px;background:#fff!important;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.pl.p1 .av{width:76px;height:76px;font-size:2.6rem;box-shadow:0 0 0 4px rgba(255,214,102,.45),0 6px 20px rgba(0,0,0,.4)}
.pl .nm{font-weight:700;font-size:1.02rem}

<body>
<header class="hero"><div class="wrap">
  <div class="brand">
    <img class="logo" src="logo.png" alt="Distinguidos Tour" onerror="this.style.display='none'">
    <div>
      <h1>Distinguidos <b>PGA Tour</b> <span id="año"></span></h1>
      <p class="sub" id="status">Cargando…</p>
    </div>
  </div>
  <nav>
    <button data-v="t" class="on">⛳ Torneo actual</button>
    <button data-v="l">📅 Torneos</button>
    <button data-v="g">🏆 Tabla general</button>
    <button data-v="p">💰 Pagos</button>
  </nav>
</div></header>
<main>
  <section id="v-t" class="sec on">
    <div class="chips" id="chips"></div>
    <div id="torneo"></div>
  </section>
  <section id="v-l" class="sec"><div id="lista"></div></section>
  <section id="v-g" class="sec"><div id="gral"></div></section>
  <section id="v-p" class="sec"><div id="pagos"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const parse=v=>{const m=String(v==null?"":v).match(/\d+/);return m?+m[0]:0};
const MED=["🥇","🥈","🥉"];
const COL=["#e11d48","#2563eb","#16a34a","#f59e0b","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#4f46e5"];
const CCOL=["#b8860b","#7c3aed","#2563eb","#0d9488","#be185d","#475569"];
let D=null,POS={},MAN={},memo={},cur=null;

const ccol=c=>CCOL[Math.max(0,Object.keys(D.clases).indexOf(c))%CCOL.length];
const ICO0={cr:"🐐",ca:"🦌",pe:"🦈",se:"🦖",jo:"🦕",be:"⚰️"};
const ico=i=>(D.iconos||{})[D.participantes[i]]||ICO0[norm(D.participantes[i]).slice(0,2)]||D.participantes[i].slice(0,2);
const av=i=>`<span class="av" style="background:${COL[i%COL.length]}22;border:2px solid ${COL[i%COL.length]}">${esc(ico(i))}</span>`;
const get=id=>D.torneos.find(t=>t.id===id);
async function jget(u){const r=await fetch(u+"?t="+Date.now());if(!r.ok)throw new Error(u);return r.json();}
function cargarJs(n,v){return new Promise((ok,no)=>{const s=document.createElement("script");s.src="data/"+n+".js?t="+Date.now();s.onload=()=>window[v]?ok(window[v]):no(new Error(n));s.onerror=()=>no(new Error(n));document.head.appendChild(s);});}
async function dato(n,v){try{return await jget("data/"+n+".json");}catch(e){return await cargarJs(n,v);}}
function pts(p){if(p<1)return 0;for(const [a,b,v] of D.escalaPos)if(p>=a&&p<=b)return v;return 0;}
function pos(t,name){
  const k=norm(name),m=(MAN.torneos||{})[t.id]||{};
  for(const x in m)if(norm(x)===k)return{v:String(m[x]),man:1};
  return{v:((POS.torneos||{})[t.id]||{})[k]||"",man:0};
}
function calc(t){
  if(memo[t.id])return memo[t.id];
  const ps=D.participantes,ix=D.torneos.indexOf(t),sc=D.clases[t.c]||[0,0,0];
  let tot,place;
  if(t.puestos){tot=ps.map(()=>null);place=t.puestos.slice();}
  else{
    const val=ps.map(p=>(t.sel[p]||[]).map(n=>parse(pos(t,n).v)));
    tot=val.map(a=>a.reduce((s,x)=>s+pts(x),0));
    const best=val.map(a=>Math.min(...a.filter(x=>x>0),999));
    const prev=[];for(let j=ix-1;j>=0;j--)prev.push(calc(D.torneos[j]).place.map(p=>p||99));
    const key=i=>[-tot[i],best[i],...prev.map(a=>a[i])];
    const cmp=(a,b)=>{for(let q=0;q<a.length;q++)if(a[q]!==b[q])return a[q]-b[q];return 0;};
    place=tot.map((x,i)=>x>0?1+ps.filter((_,j)=>tot[j]>0&&cmp(key(j),key(i))<0).length:0);
  }
  const lp=place.map(pl=>pl>0&&pl<=3?sc[pl-1]:0);
  return memo[t.id]={tot,place,lp};
}
function season(){
  const a={};Object.keys(D.clases).forEach(c=>{a[c]=D.participantes.map(()=>({c:[0,0,0],p:0}));});
  D.torneos.forEach(t=>{if(!a[t.c])return;calc(t).place.forEach((pl,i)=>{if(pl>=1&&pl<=3){a[t.c][i].c[pl-1]++;a[t.c][i].p+=D.clases[t.c][pl-1];}});});
  return a;
}
const ord=(n,f)=>[...Array(n).keys()].sort((a,b)=>f(b)-f(a)||a-b);
const pcls=p=>!p?"":p===1?"a":p<=3?"c":p<=10?"b":"";
const played=t=>calc(t).place.some(p=>p>0);

function renderGral(){
  const a=season(),ps=D.participantes,cl=Object.keys(D.clases);
  const tl=ps.map((_,i)=>cl.reduce((s,c)=>s+a[c][i].p,0)),o=ord(ps.length,i=>tl[i]),top=tl[o[0]];
  const pl=i=>1+tl.filter(v=>v>tl[i]).length;
  const pd=k=>{const i=o[k];if(i===undefined)return"";return `<div class="pl p${k+1}">${k===0?'<div class="crown">👑</div>':""}${av(i)}<div class="nm">${esc(ps[i])}</div><div class="pt">${tl[i]}<small> pts</small></div><div class="df">${k===0?"Líder":"−"+(top-tl[i])+" pts"}</div><div class="base b${k+1}">${pl(i)}</div></div>`;};
  let h=`<div class="stage"><div class="podio">${pd(1)}${pd(0)}${pd(2)}</div></div>`;
  h+=`<h2>Clasificación de la temporada</h2><div class="card scroll"><table><tr><th>#</th><th>Participante</th><th class="n">Total</th>`+cl.map(c=>`<th class="n"><span class="cb" style="--c:${ccol(c)}">${esc(c)}</span></th>`).join("")+`<th class="n dif">Dif.</th></tr>`;
  o.forEach(i=>{h+=`<tr class="${pl(i)===1&&tl[i]>0?'lead':''}"><td>${pl(i)<=3&&tl[i]>0?MED[pl(i)-1]:pl(i)}</td><td><div class="who">${av(i)}${esc(ps[i])}</div></td><td class="n tot">${tl[i]}</td>`+cl.map(c=>`<td class="n">${a[c][i].p}</td>`).join("")+`<td class="n dif" style="color:var(--mut)">${tl[i]===top?"–":tl[i]-top}</td></tr>`;});
  h+=`</table></div><p class="hint">Cada torneo reparte puntos a los 3 primeros de la polla según su clase. Si hay empate en puntos, queda primero quien tenga el jugador mejor ubicado en ese torneo; si sigue igual, decide el lugar en el torneo anterior.</p>`;
  h+=`<h2>Evolución de la temporada</h2><div class="card">${chart()}</div>`;
  h+=`<h2>Detalle por clase</h2><div class="grid">`+cl.map(c=>{
    let t=`<div class="card"><div class="thead"><span class="cb" style="--c:${ccol(c)}">${esc(c)}</span><span>${D.clases[c].map((v,k)=>MED[k]+" "+v).join(" · ")}</span></div><table><tr><th>Participante</th><th class="n">🥇</th><th class="n">🥈</th><th class="n">🥉</th><th class="n">Pts</th></tr>`;
    ord(ps.length,i=>a[c][i].p).forEach(i=>{t+=`<tr><td><div class="who">${av(i)}${esc(ps[i])}</div></td>${a[c][i].c.map(x=>`<td class="n">${x||"·"}</td>`).join("")}<td class="n tot">${a[c][i].p}</td></tr>`;});
    return t+"</table></div>";}).join("")+`</div>`;
  h+=`<h2>Puntos por posición en cada torneo</h2><div class="card rules">`+D.escalaPos.map(([x,y,v])=>`<span>${x===y?x+"°":x+"°–"+y+"°"} = <b>${v}</b></span>`).join("")+`<span>31° o más / sin corte = <b>0</b></span></div>`;
  $("gral").innerHTML=h;
}
function chart(){
  const tr=D.torneos.filter(played);if(tr.length<2)return"<span class='hint'>Se mostrará cuando haya 2 torneos con resultados.</span>";
  const ps=D.participantes,cum=ps.map(()=>[0]);
  tr.forEach(t=>{const r=calc(t);ps.forEach((_,i)=>cum[i].push(cum[i][cum[i].length-1]+r.lp[i]));});
  const W=700,H=260,L=34,B=24,T=10,R=10,mx=Math.max(...cum.flat())||1;
  const x=k=>L+(W-L-R)*k/tr.length,y=v=>H-B-(H-B-T)*v/mx;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Puntos acumulados por torneo">`;
  for(let g=0;g<=4;g++){const v=Math.round(mx*g/4);s+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#e3dfcf"/><text x="${L-6}" y="${y(v)+4}" font-size="11" text-anchor="end" fill="#667268">${v}</text>`;}
  for(let k=0;k<=tr.length;k+=Math.max(1,Math.ceil(tr.length/8)))s+=`<text x="${x(k)}" y="${H-6}" font-size="11" text-anchor="middle" fill="#667268">${k}</text>`;
  cum.forEach((c,i)=>{s+=`<polyline fill="none" stroke="${COL[i%COL.length]}" stroke-width="2.5" stroke-linejoin="round" points="${c.map((v,k)=>x(k)+","+y(v)).join(" ")}"/><circle cx="${x(tr.length)}" cy="${y(c[tr.length])}" r="4" fill="${COL[i%COL.length]}"/>`;});
  return s+`</svg><div class="leg">`+ps.map((p,i)=>`<span><i style="background:${COL[i%COL.length]}"></i>${esc(ico(i))} ${esc(p)} ${cum[i][tr.length]}</span>`).join("")+`</div><div class="hint">Puntos de liga acumulados (eje horizontal: torneos jugados).</div>`;
}
function renderChips(){
  $("chips").innerHTML=D.torneos.map(t=>`<button class="chip${t.id===cur?" on":""}" data-id="${esc(t.id)}" style="--c:${ccol(t.c)}"><i></i>${esc(t.m?t.m+" · ":"")}${esc(t.n)}</button>`).join("");
  const on=$("chips").querySelector(".on");if(on&&on.scrollIntoView)on.scrollIntoView({inline:"center",block:"nearest"});
}
function renderTorneo(){
  renderChips();
  const t=get(cur);if(!t){$("torneo").innerHTML="";return;}
  const r=calc(t),ps=D.participantes,sc=D.clases[t.c]||[0,0,0];
  let h=`<div class="thead"><div><h3>${esc(t.n)}</h3><span>${esc(t.ini?t.ini:t.m||"")}</span></div><div><span class="cb" style="--c:${ccol(t.c)}">${esc(t.c)}</span> <span>${sc.map((v,k)=>MED[k]+" "+v).join(" · ")} pts liga</span></div></div>`;
  if(!t.puestos&&!played(t)){
    const hoy=new Date().toISOString().slice(0,10);
    const cuando=t.ini&&hoy<t.ini?`Comienza el ${esc(t.ini)}. `:(t.ini&&t.fin&&hoy<=t.fin?"El torneo está en curso o por comenzar. ":"");
    h+=`<div class="aviso"><b>Torneo cargado.</b> Aún no hay posiciones. ${cuando}Aparecerán solas cuando el leaderboard publique resultados (se revisa cada 10 minutos aprox.).</div>`;
  }
  h+=`<div class="card scroll"><table><tr><th>#</th><th>Participante</th><th class="n">Pts torneo</th><th class="n">Pts liga</th></tr>`;
  ord(ps.length,i=>r.place[i]>0?100-r.place[i]:-1).forEach(i=>{const p=r.place[i];h+=`<tr class="${p===1?'lead':''}"><td>${p>=1&&p<=3?MED[p-1]:p>0?p:"–"}</td><td><div class="who">${av(i)}${esc(ps[i])}</div></td><td class="n tot">${r.tot[i]===null?"–":r.tot[i]}</td><td class="n">${r.lp[i]||"·"}</td></tr>`;});
  h+=`</table></div>`;
  if(t.puestos)h+=`<p class="hint">Este torneo se cargó solo con el puesto final de cada participante (sin detalle de jugadores).</p>`;
  else{
    h+=`<h2>Alineaciones</h2><div class="grid">`+ord(ps.length,i=>r.place[i]>0?100-r.place[i]:-1).map(i=>{
      const rows=(t.sel[ps[i]]||[]).map(n=>{const x=pos(t,n),p=parse(x.v);return `<tr><td>${esc(n)}</td><td class="n"><span class="pc ${pcls(p)}">${x.v?esc(x.v):"–"}</span>${x.man?" ✎":""}</td><td class="n">${pts(p)}</td></tr>`;}).join("");
      const pl=r.place[i];
      return `<div class="card lu"><h4><span class="who">${av(i)}${esc(ps[i])}</span><em>${pl>0&&pl<=3?MED[pl-1]+" ":""}${r.tot[i]} pts</em></h4><table><tr><th>Jugador</th><th class="n">Pos.</th><th class="n">Pts</th></tr>${rows}</table></div>`;}).join("")+`</div>`;
    h+=`<p class="hint">Las posiciones se actualizan solas desde el leaderboard. ✎ marca una posición corregida a mano.</p>`;
  }
  $("torneo").innerHTML=h;
}
function renderLista(){
  let h="";
  Object.keys(D.clases).forEach(c=>{
    const ts=D.torneos.filter(t=>t.c===c);if(!ts.length)return;
    h+=`<h2><span class="cb" style="--c:${ccol(c)}">${esc(c)}</span><span style="font-weight:400;color:var(--mut);font-size:.85rem">${D.clases[c].map((v,k)=>MED[k]+" "+v).join(" · ")}</span></h2><div class="tiles">`;
    ts.forEach(t=>{
      const r=calc(t),q=n=>r.place.map((p,i)=>p===n?D.participantes[i]:"").filter(Boolean).map(esc).join(", ");
      h+=`<button class="tile" style="--c:${ccol(c)}" data-open="${esc(t.id)}"><small>${esc(t.m||t.ini||"")}</small><b>${esc(t.n)}</b>${played(t)?`<div>🥇 ${q(1)||"–"}</div><div>🥈 ${q(2)||"–"} · 🥉 ${q(3)||"–"}</div>`:`<div style="color:var(--mut)">Sin resultados aún</div>`}</button>`;
    });
    h+="</div>";
  });
  $("lista").innerHTML=h||"<p class='hint'>Aún no hay torneos cargados.</p>";
}

const MESES=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"];
const CLP=n=>(n<0?"−":"")+"$"+Math.abs(Math.round(n)).toLocaleString("es-CL");
const cls=n=>n>0?"pos":n<0?"neg":"";
const mi=m=>MESES.findIndex(x=>x.toLowerCase()===String(m||"").slice(0,3).toLowerCase());
let mesSel=null;
function idx(nombres){return (nombres||[]).map(x=>D.participantes.findIndex(p=>norm(p)===norm(x))).filter(i=>i>=0);}
function pagosTorneo(t){
  const ps=D.participantes,r=calc(t);
  if(!r.place.some(p=>p>0))return null;
  const z=()=>ps.map(()=>0),recP=z(),payP=z(),recC=z(),payC=z(),pg=D.pagos||{},pr=(pg.premios||{})[t.c]||[0,0];
  const todos=ps.map((_,i)=>i);
  const gan=todos.filter(i=>r.place[i]===1);
  const cam=t.campeones?idx(t.campeones):(t.puestos?[]:todos.filter(i=>(t.sel[ps[i]]||[]).some(n=>parse(pos(t,n).v)===1)));
  const repartir=(S,monto)=>{if(!S.length||!monto)return;const pagan=todos.filter(i=>!S.includes(i));S.forEach(i=>recP[i]+=monto/S.length);pagan.forEach(i=>payP[i]+=monto/pagan.length);};
  repartir(gan,pr[0]);repartir(cam,pr[1]);
  let benef=0;
  if(t.corte&&t.corte.pagan&&t.corte.pagan.length){
    const cu=(pg.corte||{}).cuota||2000,rd=(pg.corte||{}).redondeo||100,P_=idx(t.corte.pagan),G_=idx(t.corte.ganan);
    if(!G_.length){P_.forEach(i=>payC[i]+=cu);benef=cu*P_.length;}
    else{const c1=Math.ceil(cu/G_.length/rd)*rd;P_.forEach(i=>payC[i]+=c1*G_.length);G_.forEach(i=>recC[i]+=c1*P_.length);}
  }
  return{recP,payP,recC,payC,gan,cam,pr,benef,corte:t.corte||null};
}
function meses(){
  const o=[],mp={},ps=D.participantes,z=()=>ps.map(()=>0);
  D.torneos.forEach(t=>{if(!t.m)return;if(!mp[t.m]){mp[t.m]={m:t.m,ts:[]};o.push(mp[t.m]);}mp[t.m].ts.push(t);});
  o.forEach(x=>{x.netP=z();x.netC=z();x.benef=0;x.jug=0;
    x.det=x.ts.map(t=>{const p=pagosTorneo(t);if(p){x.jug++;ps.forEach((_,i)=>{x.netP[i]+=p.recP[i]-p.payP[i];x.netC[i]+=p.recC[i]-p.payC[i];});x.benef+=p.benef;}return{t,p};});
    x.net=x.netP.map((v,i)=>v+x.netC[i]);});
  const act=D.actual&&get(D.actual)?get(D.actual).m:(o.filter(x=>x.jug).slice(-1)[0]||{}).m;
  o.forEach(x=>{x.cerrado=x.jug>0&&mi(x.m)<mi(act);});
  return{lista:o,act};
}
function transferencias(net){
  const d=[],c=[];net.forEach((v,i)=>{v=Math.round(v);if(v<0)d.push([i,-v]);if(v>0)c.push([i,v]);});
  d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const out=[];
  while(d.length&&c.length){const m=Math.min(d[0][1],c[0][1]);out.push([d[0][0],c[0][0],m]);d[0][1]-=m;c[0][1]-=m;if(!d[0][1])d.shift();if(!c[0][1])c.shift();}
  return out;
}
function tablaTransf(net){
  const ps=D.participantes,tr=transferencias(net);
  return tr.length?tr.map(([a,b,m])=>`<div class="xfer">${av(a)}<span><b style="margin:0;font-size:1rem">${esc(ps[a])}</b> paga a</span>${av(b)}<span><b style="margin:0;font-size:1rem">${esc(ps[b])}</b></span><b class="pos">${CLP(m)}</b></div>`).join(""):"<span class='hint'>Sin pagos pendientes.</span>";
}
function renderPagos(){
  const ps=D.participantes,{lista,act}=meses(),pg=D.pagos||{};
  const con=lista.filter(x=>x.jug);
  if(!con.length){$("pagos").innerHTML="<p class='hint'>Aún no hay torneos con resultados para calcular pagos.</p>";return;}
  if(!mesSel||!con.some(x=>x.m===mesSel))mesSel=(con.find(x=>x.m===act)||con[con.length-1]).m;
  const sum=k=>ps.map((_,i)=>con.reduce((s,x)=>s+x[k][i],0)),tp=sum("netP"),tc=sum("netC"),tot=sum("net");
  let h=`<h2>Acumulado de la temporada</h2><div class="card scroll"><table><tr><th>Participante</th><th class="n">Premios</th><th class="n">Corte</th><th class="n">Total</th></tr>`;
  ord(ps.length,i=>tot[i]).forEach(i=>{h+=`<tr><td><div class="who">${av(i)}${esc(ps[i])}</div></td><td class="n ${cls(tp[i])}">${CLP(tp[i])}</td><td class="n ${cls(tc[i])}">${CLP(tc[i])}</td><td class="n tot ${cls(tot[i])}">${CLP(tot[i])}</td></tr>`;});
  h+=`</table></div><p class="hint">Verde: recibe. Rojo: debe pagar. Suma de todos los meses con resultados.</p>`;
  h+=`<h2>Neto por mes</h2><div class="card scroll"><table><tr><th>Participante</th>`+con.map(x=>`<th class="n">${esc(x.m)} ${x.cerrado?"🔒":"⏳"}</th>`).join("")+`</tr>`;
  ord(ps.length,i=>tot[i]).forEach(i=>{h+=`<tr><td><div class="who">${av(i)}${esc(ps[i])}</div></td>`+con.map(x=>`<td class="n ${cls(x.net[i])}">${x.net[i]?CLP(x.net[i]):"·"}</td>`).join("")+`</tr>`;});
  h+=`</table></div><p class="hint">🔒 mes cerrado · ⏳ mes en curso (provisorio).</p>`;
  h+=`<div class="chips" style="margin-top:14px">`+con.map(x=>`<button class="chip${x.m===mesSel?" on":""}" data-mes="${esc(x.m)}"><i style="--c:#c6f613"></i>${esc(x.m)}${x.cerrado?" 🔒":" ⏳"}</button>`).join("")+`</div>`;
  const x=con.find(y=>y.m===mesSel),cerr=x.cerrado;
  h+=`<h2>${esc(x.m)} <span class="cerr ${cerr?"ok":""}">${cerr?"Mes cerrado":"Mes en curso (provisorio)"}</span></h2>`;
  h+=`<div class="card scroll"><table><tr><th>Torneo</th><th>Clase</th><th>Ganador</th><th>Campeón</th><th class="n">Corte</th></tr>`;
  x.det.forEach(({t,p})=>{
    if(!p){h+=`<tr><td>${esc(t.n)}</td><td><span class="cb" style="--c:${ccol(t.c)}">${esc(t.c)}</span></td><td colspan="3" style="color:var(--mut)">Sin resultados aún</td></tr>`;return;}
    const nm=a=>a.length?a.map(i=>esc(ps[i])).join(", "):"–";
    const ct=p.corte&&p.corte.pagan.length?(p.corte.ganan.length?`${p.corte.pagan.length} pagan · ${p.corte.ganan.length} ganan`:"A beneficencia"):"·";
    h+=`<tr><td>${esc(t.n)}</td><td><span class="cb" style="--c:${ccol(t.c)}">${esc(t.c)}</span></td><td>${nm(p.gan)} <small>${p.gan.length?CLP(p.pr[0]):""}</small></td><td>${nm(p.cam)} <small>${p.cam.length?CLP(p.pr[1]):""}</small></td><td class="n">${ct}</td></tr>`;});
  h+=`</table></div>`;
  h+=`<h2>Balance de ${esc(x.m)}</h2><div class="card scroll"><table><tr><th>Participante</th><th class="n">Premios</th><th class="n">Corte</th><th class="n">Total</th></tr>`;
  ord(ps.length,i=>x.net[i]).forEach(i=>{h+=`<tr><td><div class="who">${av(i)}${esc(ps[i])}</div></td><td class="n ${cls(x.netP[i])}">${x.netP[i]?CLP(x.netP[i]):"·"}</td><td class="n ${cls(x.netC[i])}">${x.netC[i]?CLP(x.netC[i]):"·"}</td><td class="n tot ${cls(x.net[i])}">${CLP(x.net[i])}</td></tr>`;});
  h+=`</table></div>`+(x.benef?`<p class="hint">A beneficencia este mes: <b>${CLP(x.benef)}</b> (ya incluido en lo que paga cada perdedor).</p>`:"");
  h+=`<h2>Quién le paga a quién en ${esc(x.m)}</h2><div class="card">${tablaTransf(x.net)}</div>`;
  h+=`<p class="hint">Es la liquidación con menos transferencias posible para dejar a todos en cero.${cerr?"":" Como el mes sigue en curso, los montos pueden cambiar."}</p>`;
  h+=`<details class="calc"><summary>Liquidación acumulada de la temporada (todos los meses)</summary><div style="margin-top:8px">${tablaTransf(tot)}</div><p class="hint">Úsala solo si no has liquidado mes a mes; si ya pagaron algún mes, descuéntalo.</p></details>`;
  const pr=pg.premios||{},cu=((pg.corte||{}).cuota||2000);
  h+=`<details class="calc"><summary>Cómo se calcula</summary><p>En cada torneo se pagan dos premios: <b>Ganador</b> (1° de la polla) y <b>Campeón</b> (dueño del jugador que ganó el torneo real). Si es la misma persona recibe ambos; si son distintas, cada una recibe el suyo. Cada premio lo pagan en partes iguales todos los demás participantes.</p><table><tr><th>Clase</th><th class="n">Ganador</th><th class="n">Campeón</th></tr>`+Object.keys(pr).map(c=>`<tr><td><span class="cb" style="--c:${ccol(c)}">${esc(c)}</span></td><td class="n">${CLP(pr[c][0])}</td><td class="n">${CLP(pr[c][1])}</td></tr>`).join("")+`</table><p><b>Corte:</b> cada participante que no pasa el corte paga ${CLP(cu)}, repartidos entre quienes sí pasaron; cada parte se redondea hacia arriba a ${CLP((pg.corte||{}).redondeo||100)} (por eso a veces se pagan ${CLP(cu+100)}). Si nadie pasa, cada uno abona la cuota a la beneficencia.</p><p><b>Neto del mes = premios recibidos − premios que le toca pagar + cortes recibidos − cuotas del corte.</b> Es un ítem más de la tabla: Premios + Corte = Total.</p></details>`;
  $("pagos").innerHTML=h;
}
function show(v){
  ["t","l","g","p"].forEach(x=>$("v-"+x).classList.toggle("on",x===v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  if(v==="g")renderGral();if(v==="p")renderPagos();if(v==="t")renderTorneo();if(v==="l")renderLista();
}
const vista=()=>["t","l","g","p"].find(x=>$("v-"+x).classList.contains("on"));
function elegir(){
  if(D.actual&&get(D.actual))return D.actual;
  const h=new Date().toISOString().slice(0,10);
  let c=D.torneos.find(t=>t.ini&&t.fin&&t.ini<=h&&h<=t.fin);
  if(!c){const p=D.torneos.filter(played);c=p.length?p[p.length-1]:D.torneos[0];}
  return c?c.id:null;
}
function estado(){
  const a=POS.actualizado?new Date(POS.actualizado):null;
  $("status").textContent=a&&!isNaN(a)?"Última actualización de posiciones: "+a.toLocaleString("es-CL",{dateStyle:"medium",timeStyle:"short"}):"Torneo fantasy · "+D.participantes.length+" participantes";
}
async function cargar(inicial){
  if(window.__DATOS__){POS=window.__DATOS__.POS||{};MAN=window.__DATOS__.MAN||{};}
  else{try{POS=await dato("posiciones","__P");}catch(e){POS={};}try{MAN=await dato("manual","__M");}catch(e){MAN={};}}
  memo={};estado();if(!inicial)show(vista());
}
async function iniciar(){
  try{D=window.__DATOS__?window.__DATOS__.D:await dato("datos","__D");}
  catch(e){$("status").textContent="No se pudieron cargar los datos. Abre la página publicada en GitHub Pages, o espera a que Actions genere data/datos.js y haz Pull.";return;}
  document.title="Distinguidos PGA Tour "+(D.temporada||"");$("año").textContent=D.temporada||"";
  cur=elegir();
  document.querySelector("nav").addEventListener("click",e=>{const b=e.target.closest("button");if(b)show(b.dataset.v);});
  $("chips").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b){cur=b.dataset.id;renderTorneo();}});
  $("pagos").addEventListener("click",e=>{const b=e.target.closest("[data-mes]");if(b){mesSel=b.dataset.mes;renderPagos();}});
  $("lista").addEventListener("click",e=>{const b=e.target.closest("[data-open]");if(b){cur=b.dataset.open;show("t");scrollTo(0,0);}});
  await cargar(true);show("t");
  if(!window.__DATOS__)setInterval(()=>cargar(false),300000);
}
iniciar();
</script>
